<!DOCTYPE html>

<head>

<body>

<div class="container">

    <div class="left">
      
        <p>

    <div class="login-box">
        <h2>Entrar</h2>

        <form id="loginForm">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">Acessar Sistema</button>
            <a href="http://127.0.0.1:5500/cadastro.html" target="_blank">Faça seu Cadastro!</a><p> </p><a href="http://127.0.0.1:5500/senha.html" target="_blank">Esqueceu sua Senha?</a>
            
        </form>

        <p id="mensagem"></p>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
